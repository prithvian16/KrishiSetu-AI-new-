function setLanguage(value){localStorage.setItem("kisanLanguage",value); els.language.value=value; document.documentElement.lang=LANGS[value]?.code||"en"; document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n)); if(data){data.farmer.preferredLanguage=value;} render();}
function fillLanguages(){els.language.innerHTML=Object.entries(LANGS).map(([name,v])=>`<option value="${name}">${v.native}</option>`).join(""); els.language.value=lang();}
function showTab(name){currentTab=name; ["home","crop","queue","payment","profile"].forEach(n=>{document.getElementById(n).classList.toggle("hidden",n!==name);document.getElementById("n-"+n).classList.toggle("active",n===name);}); if(name==="crop")renderCrop();if(name==="queue")renderQueue();if(name==="payment")renderPayments();if(name==="profile")renderProfile(); els.home.scrollTop=0; document.getElementById("appScreen").scrollTop=0;}

async function loadDashboard(){
  try{
    data=await api(`/api/farmers/${farmerId}`);
    booking=await api(`/api/farmers/${farmerId}/active-booking`);
    payments=await api(`/api/farmers/${farmerId}/payments`);
    fillLanguages(); render();
  }catch(e){els.home.innerHTML=`<div class="mobile-card notice error"><b>${t("error")}</b><p>${escapeHtml(e.message)}</p><button class="mobile-btn" onclick="loadDashboard()">${t("retry")}</button></div>`;}
}

function render(){
  if(!data)return; els.sub.textContent=data.farmer.name+" · "+data.farmer.farmerId;
  const records=data.cropRecords||[];
  const bookingCard=booking?`<div class="mobile-card token-card"><div class="kpi"><b>${t("activeToken")}</b><span class="badge">${escapeHtml(booking.status)}</span></div><div class="mobile-stat token">${escapeHtml(booking.tokenCode)}</div><p>${escapeHtml(booking.centre.name)}</p><p><b>${t("queuePosition")} #${escapeHtml(booking.queuePosition)}</b> · ${t("estimatedWait")} ${escapeHtml(booking.etaMin)}–${escapeHtml(booking.etaMax)} min</p><button class="mobile-btn" id="trackQueueBtn">${t("trackQueue")}</button></div>`:`<div class="mobile-card"><div class="quality-icon">📷</div><h3>${t("qualityWow")}</h3><p class="muted">${t("qualityWowText")}</p><button class="mobile-btn" id="registerCropBtn">${t("registerCrop")}</button></div>`;
  const rows=records.slice(0,3).map(r=>`<div class="record-row"><div><b>${escapeHtml(r.cropType)}</b><div class="small muted">${escapeHtml(r.estimatedQuantity)} qtl</div></div><span class="badge">${escapeHtml(r.aiScreening?.grade||"Pending")}</span></div>`).join("");
  const latestPayment=payments[0];
  els.home.innerHTML=`<div class="welcome-card"><div class="welcome-orb">🌾</div><div class="small">${t("welcome")}</div><h2>${escapeHtml(data.farmer.name)}</h2><p>${t("plan")}</p></div>${bookingCard}<div class="mobile-card"><div class="kpi"><b>${t("cropRecords")}</b><span class="pill">${records.length}</span></div>${rows||`<p class="muted">${t("noRecords")}</p>`}</div>${latestPayment?`<div class="mobile-card payment-mini"><div class="kpi"><b>${t("paymentTitle")}</b><span class="badge ${latestPayment.payment.status==='PAID'?'':'warn'}">${latestPayment.payment.status==='PAID'?t("paid"):t("processing")}</span></div><div class="mobile-stat">${money(latestPayment.payment.amount)}</div><button class="mobile-btn secondary" id="paymentBtn">${t("payment")}</button></div>`:""}`;
  document.getElementById("registerCropBtn")?.addEventListener("click",()=>showTab("crop"));
  document.getElementById("trackQueueBtn")?.addEventListener("click",()=>showTab("queue"));
  document.getElementById("paymentBtn")?.addEventListener("click",()=>showTab("payment"));
  renderCrop();renderQueue();renderPayments();renderProfile();
}

function renderCrop(){
 els.crop.innerHTML=`<div class="mobile-card"><div class="section-icon">🌾</div><h2>${t("registerTitle")}</h2><p class="muted">${t("registerHelp")}</p><form id="cropForm"><div class="field"><label>${t("cropType")}</label><select name="cropType"><option>Wheat</option><option>Paddy</option><option>Bajra</option><option>Maize</option></select></div><br><div class="field"><label>${t("quantity")}</label><input name="estimatedQuantity" type="number" min="1" required></div><br><div class="field"><label>${t("location")}</label><input name="location" required></div><br><div class="quality-choice"><div><b>${t("preCheck")}</b><div class="small muted">${t("preCheckHelp")}</div></div><label class="switch"><input type="checkbox" name="runScreening" checked><span></span></label></div><div id="qualityFields"><br><div class="field"><label>${t("cropPhoto")}</label><input name="photo" type="file" accept="image/*" id="photoInput"><img id="photoPreview" class="photo hidden"></div><br><div class="field"><label>${t("visibleDamage")}</label><select name="visibleDamage"><option value="low">${t("low")}</option><option value="medium">${t("medium")}</option><option value="high">${t("high")}</option></select></div><br><div class="field"><label>${t("moisture")}</label><input name="moisture" type="number" step="0.1" value="12"></div><br><div class="field"><label>${t("impurity")}</label><input name="impurity" type="number" step="0.1" value="1"></div></div><br><div class="field"><label>${t("authPrice")}</label><input name="authorisedPrice" type="number" value="2300"></div><br><div class="field"><label>${t("prefPrice")}</label><input name="farmerPreferredPrice" type="number"></div><br><button class="mobile-btn" type="submit">${t("analyse")}</button></form><div id="cropResult"></div></div>`;
 const input=document.getElementById("photoInput"); input?.addEventListener("change",previewPhoto); document.querySelector('input[name="runScreening"]')?.addEventListener("change",e=>{
   document.getElementById("qualityFields").classList.toggle("hidden",!e.target.checked);
   const submit=e.target.form.querySelector('button[type="submit"]');
   if(submit) submit.textContent=e.target.checked?t("analyse"):t("skipCheck");
 });
}
function previewPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;const p=document.getElementById("photoPreview");p.src=photoData;p.classList.remove("hidden")};r.readAsDataURL(f)}

document.addEventListener("submit",async e=>{if(e.target.id!=="cropForm")return;e.preventDefault();const f=new FormData(e.target), resultEl=document.getElementById("cropResult"), run=f.get("runScreening")==="on";try{const crop=await api("/api/procurement/crops",{method:"POST",body:JSON.stringify({farmerId,cropType:f.get("cropType"),estimatedQuantity:f.get("estimatedQuantity"),location:f.get("location"),cropPhotoUrl:photoData,runScreening:run,visibleDamage:f.get("visibleDamage"),moisture:f.get("moisture"),impurity:f.get("impurity"),authorisedPrice:f.get("authorisedPrice"),farmerPreferredPrice:f.get("farmerPreferredPrice")})});localStorage.setItem("cropRecordId",crop._id);resultEl.innerHTML=`<div class="notice"><b>${t("preliminary")}: ${escapeHtml(crop.aiScreening.grade)}</b><br>${t("finalOfficial")}<br><span class="small">${escapeHtml(crop.aiScreening.disclaimer)}</span></div><div class="mobile-card" style="margin-top:12px;background:#f7fbf7;border-color:#d8e8d9"><div class="quality-icon">👨‍🌾</div><h3>Optional expert visit</h3><p class="muted">Would you like an expert to check your crop at your farm before you travel? This is preliminary guidance. The final procurement decision is still made at the centre.</p><div class="mobile-row"><button class="mobile-btn" id="visitBtn">Request expert visit</button><button class="mobile-btn secondary" id="continueBtn">Continue without visit</button></div><div id="visitResult"></div></div>`;document.getElementById("visitBtn").onclick=()=>requestExpertVisit(crop._id);document.getElementById("continueBtn").onclick=()=>showRecommendations(crop);data=await api(`/api/farmers/${farmerId}`);renderProfile()}catch(err){resultEl.innerHTML=`<div class="notice error"><b>${t("error")}</b><br>${escapeHtml(err.message)}</div>`}});

async function requestExpertVisit(cropRecordId){const result=document.getElementById("visitResult"),button=document.getElementById("visitBtn");if(!result||!button)return;button.disabled=true;try{const visit=await api("/api/procurement/visit-request",{method:"POST",body:JSON.stringify({farmerId,cropRecordId})});result.innerHTML=`<div class="notice" style="margin-top:10px"><b>Expert visit requested ✓</b><br>An inspector will review the request for <b>${escapeHtml(visit.location)}</b>.<br><span class="badge">${escapeHtml(visit.status)}</span></div><button class="mobile-btn secondary" id="visitContinueBtn">Continue to centre recommendations</button>`;document.getElementById("visitContinueBtn").onclick=()=>showRecommendations({ _id:cropRecordId, cropType:visit.cropRecord?.cropType, estimatedQuantity:visit.cropRecord?.estimatedQuantity, aiScreening:visit.cropRecord?.aiScreening });}catch(err){result.innerHTML=`<div class="notice error" style="margin-top:10px"><b>${t("error")}</b><br>${escapeHtml(err.message)}</div>`;button.disabled=false}}

async function showRecommendations(crop){
  const resultEl=document.getElementById("cropResult");
  resultEl.innerHTML=`<div class="notice">Loading smart centre recommendations...</div>`;
  try{
    const grade=crop.aiScreening?.grade||"PENDING";
    const centres=await api(`/api/procurement/centres/recommend?cropType=${encodeURIComponent(crop.cropType)}&grade=${encodeURIComponent(grade)}&quantity=${encodeURIComponent(crop.estimatedQuantity)}`);
    if(!centres.length){resultEl.innerHTML=`<div class="notice error">No compatible procurement centre is available for ${escapeHtml(crop.cropType)} right now.</div>`;return;}
    resultEl.innerHTML=`<div class="mobile-card" style="margin-top:12px"><h3>Smart centre recommendation</h3><p class="small muted">Ranked using crop compatibility, grade requirement, distance, queue and available capacity.</p>${centres.map((c,i)=>`<div class="centre-option ${i===0?'best':''}"><div class="kpi"><div><b>${i===0?'⭐ Best match · ':''}${escapeHtml(c.name)}</b><div class="small muted">${escapeHtml(c.district||'')} · ${escapeHtml(c.distanceKm)} km</div></div><span class="badge">Score ${escapeHtml(c.recommendationScore)}</span></div><div class="recommend-grid"><span>Queue <b>${escapeHtml(c.queueCount)}</b></span><span>Wait <b>${escapeHtml(c.estimatedQueueDelayMinutes)} min</b></span><span>Capacity <b>${escapeHtml(c.availableCapacity)} qtl</b></span><span>Grade <b>${c.gradeAccepted?'Eligible':'Not eligible'}</b></span></div>${c.gradeAccepted?`<button class="mobile-btn" data-centre-id="${escapeHtml(c._id)}">Book here</button>`:`<div class="small muted">Minimum grade: ${escapeHtml(c.minimumGrade)}</div>`}</div>`).join("")}</div>`;
    resultEl.querySelectorAll("[data-centre-id]").forEach(btn=>btn.onclick=()=>bookFromApp(btn.dataset.centreId,crop._id));
  }catch(err){resultEl.innerHTML=`<div class="notice error"><b>${t("error")}</b><br>${escapeHtml(err.message)}</div>`;}
}

async function bookFromApp(centreId,cropRecordId){
  try{
    const b=await api("/api/procurement/book",{method:"POST",body:JSON.stringify({farmerId,centreId,cropRecordId,slotDate:new Date().toISOString().slice(0,10),slotStart:"10:00",slotEnd:"11:00"})});
    booking=b;
    await loadDashboard();
    showTab("queue");
  }catch(err){alert(err.message)}
}

function renderQueue(){if(!booking){els.queue.innerHTML=`<div class="mobile-card"><div class="section-icon">🎟</div><h2>${t("noToken")}</h2><p class="muted">${t("noTokenHelp")}</p></div>`;return}const ns=(booking.notifications||[]).slice().reverse().map(n=>`<div class="notice">${escapeHtml(n.message)}</div>`).join("");const progress=Math.max(5,Math.min(95,100-(Number(booking.queuePosition||1)*8)));els.queue.innerHTML=`<div class="mobile-card token-card"><div class="small">${t("liveToken")}</div><div class="token">${escapeHtml(booking.tokenCode)}</div><p>${escapeHtml(booking.centre.name)}</p></div><div class="mobile-card"><div class="kpi"><b>${t("queuePosition")}</b><span class="mobile-stat">#${escapeHtml(booking.queuePosition)}</span></div><div class="mini-progress"><div style="width:${progress}%"></div></div><p>${t("estimatedWait")}: <b>${escapeHtml(booking.etaMin)}–${escapeHtml(booking.etaMax)} min</b></p><span class="badge">${escapeHtml(booking.status)}</span><div class="mobile-row" style="margin-top:12px"><button class="mobile-btn secondary" id="arriveBtn">${t("arrived")}</button><button class="mobile-btn danger" id="cancelBtn">${t("cancel")}</button></div></div><div class="mobile-card"><h3>${t("notifications")}</h3>${ns||`<p class="muted">${t("noNotifications")}</p>`}</div>`;document.getElementById("arriveBtn").onclick=arrive;document.getElementById("cancelBtn").onclick=cancelBooking}
async function arrive(){try{await api(`/api/procurement/booking/${booking._id}/arrive`,{method:"POST"});await loadDashboard();showTab("queue")}catch(e){alert(e.message)}}
async function cancelBooking(){if(!confirm(t("cancel")+"?"))return;try{await api(`/api/procurement/booking/${booking._id}/cancel`,{method:"POST"});await loadDashboard();showTab("home")}catch(e){alert(e.message)}}

function renderPayments(){if(!els.payment)return;els.payment.innerHTML=`<div class="mobile-card payment-hero"><div class="section-icon">₹</div><h2>${t("paymentTitle")}</h2><p class="muted">${t("paymentHelp")}</p></div>${payments.length?payments.map(p=>{const s=p.payment?.status||"NOT_STARTED";return `<div class="mobile-card payment-card"><div class="kpi"><div><b>${escapeHtml(p.cropRecord?.cropType||"Crop")}</b><div class="small muted">${escapeHtml(p.centre?.name||"")}</div></div><span class="badge ${s==='PAID'?'':'warn'}">${s==='PAID'?t("paid"):t("processing")}</span></div><div class="payment-amount">${money(p.payment?.amount)}</div><div class="payment-grid"><div><span class="small muted">${t("reference")}</span><b>${escapeHtml(p.payment?.reference||"—")}</b></div><div><span class="small muted">${t("saleDate")}</span><b>${p.completedAt?new Date(p.completedAt).toLocaleDateString(LANGS[lang()]?.code||"en-IN"):"—"}</b></div></div><div class="timeline"><div class="timeline-dot ${s!=="NOT_STARTED"?'done':''}"></div><div><b>${s==='PAID'?t("paid"):t("processing")}</b><div class="small muted">${p.payment?.updatedAt?new Date(p.payment.updatedAt).toLocaleString(LANGS[lang()]?.code||"en-IN"):t("paymentEmpty")}</div></div></div></div>`}).join(""):`<div class="mobile-card empty-state"><div class="section-icon">💳</div><h3>${t("noPayments")}</h3><p class="muted">${t("paymentEmpty")}</p></div>`}`}

function renderProfile(){const b=data?.farmer?.bank||{};els.profile.innerHTML=`<div class="mobile-card profile-head"><div class="avatar">${escapeHtml((data.farmer.name||"F").charAt(0).toUpperCase())}</div><h2>${t("profileTitle")}</h2><p class="muted">${escapeHtml(data.farmer.name)}</p></div><div class="mobile-card"><p><b>Farmer ID</b><br>${escapeHtml(data.farmer.farmerId)}</p><p><b>Mobile</b><br>${escapeHtml(data.farmer.mobile)}</p><p><b>Location</b><br>${escapeHtml(data.farmer.village)}, ${escapeHtml(data.farmer.district)}, ${escapeHtml(data.farmer.state)}</p><p><b>Land</b><br>${escapeHtml(data.farmer.landArea||"—")} acres</p></div><div class="mobile-card"><h3>🏦 ${t("paymentProfile")}</h3><p><b>${escapeHtml(b.accountHolderName)}</b><br>${escapeHtml(b.bankName)} · ${escapeHtml(b.ifsc)}</p><p class="mask">Account: ${escapeHtml(b.maskedAccountNumber)}</p><span class="badge">${escapeHtml(b.governmentSyncStatus)}</span><p class="small muted">${t("governmentRef")}: ${escapeHtml(b.governmentReferenceId||"—")}</p></div><div class="mobile-card"><h3>🌐 ${t("language")}</h3><p class="small muted">${t("selectLanguage")}</p><select id="profileLanguage" class="full-select">${Object.entries(LANGS).map(([n,v])=>`<option value="${n}" ${lang()===n?'selected':''}>${v.native}</option>`).join("")}</select></div><div class="mobile-card"><h3>🖥️ ${t("switchDash")}</h3><div class="switch-links"><a class="mobile-btn secondary" href="/centre.html">${t("centreDash")}</a><a class="mobile-btn secondary" href="/inspector.html">${t("inspectorDash")}</a><a class="mobile-btn secondary" href="/admin.html">${t("govDash")}</a></div></div><button class="mobile-btn secondary" id="logoutBtn">${t("exitApp")}</button><button class="mobile-btn danger" id="logoutRealBtn" style="margin-top:8px">${t("logout")}</button>`;document.getElementById("profileLanguage").onchange=e=>setLanguage(e.target.value);document.getElementById("logoutBtn").onclick=()=>location.href="/";document.getElementById("logoutRealBtn").onclick=()=>{localStorage.clear();location.href="/login.html"}}

els.language.onchange=e=>setLanguage(e.target.value);document.getElementById("refreshBtn").onclick=loadDashboard;["home","crop","queue","payment","profile"].forEach(n=>document.getElementById("n-"+n).onclick=()=>showTab(n));
loadDashboard();setInterval(async()=>{try{booking=await api(`/api/farmers/${farmerId}/active-booking`);payments=await api(`/api/farmers/${farmerId}/payments`);if(currentTab==="queue")renderQueue();if(currentTab==="payment")renderPayments();}catch(e){}},8000);
</script>
</body></html>
