<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KrishiSetuAI · Procurement Centre</title><link rel="stylesheet" href="/css/style.css"></head>
<body><nav class="nav"><div class="brand">🌾 KrishiSetuAI · Procurement Centre</div><div class="nav-links"><a href="/">Home</a><a href="/inspector.html">Inspector</a><a href="/admin.html">Government</a></div></nav>
<div class="container"><div class="topbar"><div><h1>Centre operations</h1><p class="muted">Live queue, capacity and official verification.</p></div><select id="centre" class="pill"></select></div>
<div id="kpis" class="grid"></div>
<div class="two-col" style="margin-top:18px"><div class="card"><div class="topbar"><h2>Live queue</h2><button class="btn" onclick="callNext()">Call next farmer</button></div><div id="queue"></div></div>
<div><div class="card"><h2>Capacity</h2><p class="muted">Change the centre's hourly service capacity.</p><div class="field"><label>Hourly capacity (quintals)</label><input id="capacity" type="number" min="1"></div><br><button class="btn" onclick="saveCapacity()">Update capacity</button><div id="capMsg"></div></div>
<div id="verifyCard" class="card hidden"><h2>Official verification</h2><p id="currentInfo" class="muted"></p><form id="verify"><div class="field"><label>Result</label><select id="result"><option value="ACCEPTED">ACCEPTED</option><option value="REJECTED">REJECTED</option></select></div><br><div class="field"><label>Final grade</label><select id="grade"><option>A</option><option>B</option><option>C</option></select></div><br><div class="field"><label>Verified quantity (quintals)</label><input id="qty" type="number" min="1" required></div><br><div class="field"><label>Condition</label><input id="condition" value="Physically verified"></div><br><div class="field"><label>Inspector</label><input id="inspector" value="Authorised Inspector"></div><br><div class="field"><label>Notes</label><textarea id="notes" rows="3"></textarea></div><br><div class="field"><label>Price ₹/quintal</label><input id="price" type="number" value="2300" min="1"></div><br><button class="btn">Record verification</button></form></div></div></div>
<div class="card" style="margin-top:18px"><h2>Queue distribution</h2><div id="queueBars"></div></div></div>
<script src="/js/api.js"></script><script>
let current=null;
async function init(){const d=await api('/api/admin/overview');centre.innerHTML=d.centres.map(c=>`<option value="${c._id}">${escapeHtml(c.name)}</option>`).join('');await load()}
async function load(){if(!centre.value)return;const d=await api('/api/admin/centre/'+centre.value+'/status');const c=d.centre;kpis.innerHTML=[['Waiting farmers',c.queueCount],['Booked load',c.bookedQuantity+' qtl'],['Hourly capacity',c.hourlyCapacity+' qtl'],['Current token',c.currentServingToken||'—']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${escapeHtml(x[1])}</div></div>`).join('');capacity.value=c.hourlyCapacity;queue.innerHTML=d.queue.length?'<table class="table"><tr><th>Pos.</th><th>Token</th><th>Farmer</th><th>Crop</th><th>Qty</th><th>Status</th></tr>'+d.queue.map(b=>`<tr><td>${escapeHtml(b.queuePosition)}</td><td><b>${escapeHtml(b.tokenCode)}</b></td><td>${escapeHtml(b.farmer?.name)}</td><td>${escapeHtml(b.cropRecord?.cropType)}</td><td>${escapeHtml(b.quantity)} qtl</td><td><span class="badge">${escapeHtml(b.status)}</span></td></tr>`).join('')+'</table>':'<div class="notice">No active farmers in queue.</div>';
queueBars.innerHTML=d.queue.slice(0,10).map(b=>`<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="width:75px;font-weight:700">${escapeHtml(b.tokenCode)}</span><div class="progress" style="flex:1"><div style="width:${Math.max(6,100-(b.queuePosition-1)*8)}%"></div></div><span>${escapeHtml(b.queuePosition)}</span></div>`).join('')||'<p class="muted">No queue data.</p>'}
async function callNext(){try{current=await api('/api/admin/call-next/'+centre.value,{method:'POST'});currentInfo.textContent=`${current.tokenCode} · ${current.farmer.name} · ${current.cropRecord.cropType} · ${current.quantity} qtl`;qty.value=current.quantity;verifyCard.classList.remove('hidden');await load()}catch(e){alert(e.message)}}
verify.addEventListener('submit',async e=>{e.preventDefault();if(!current)return;try{await api('/api/procurement/operator/'+current._id+'/record',{method:'POST',body:JSON.stringify({result:result.value,grade:grade.value,quantity:qty.value,pricePerQuintal:price.value,condition:condition.value,inspector:inspector.value,notes:notes.value})});alert('Official verification saved.');verifyCard.classList.add('hidden');current=null;await load()}catch(e){alert(e.message)}});
centre.addEventListener('change',load);async function saveCapacity(){try{await api('/api/admin/centre/'+centre.value+'/capacity',{method:'POST',body:JSON.stringify({hourlyCapacity:capacity.value})});capMsg.innerHTML='<div class="notice">Capacity updated.</div>';await load()}catch(e){capMsg.innerHTML='<div class="notice error">'+escapeHtml(e.message)+'</div>'}}init();setInterval(load,10000);
</script></body></html>
