<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KrishiSetuAI Registration</title><link rel="stylesheet" href="/css/style.css"></head><body class="app-page"><div class="mobile-wrap app-wrap"><div class="phone auth-phone"><div class="auth-screen scroll-auth"><div class="auth-top"><div class="auth-logo small-logo">🌾</div><div><b>KrishiSetuAI</b><div class="small muted">Farmer registration</div></div><select id="authLanguage" class="language-select" style="margin-left:auto"></select></div><h1 data-auth="signupTitle">Create account</h1><p class="muted" data-auth="signupHelp">Register once. Your farmer profile and payment details stay connected to your procurement journey.</p><form id="form"><div class="field"><label data-auth="name">Full name</label><input name="name" required></div><br><div class="field"><label data-auth="mobile">Mobile number</label><input name="mobile" required maxlength="10" inputmode="numeric"></div><br><div class="field"><label data-auth="village">Village</label><input name="village" required></div><br><div class="field"><label data-auth="district">District</label><input name="district" required></div><br><div class="field"><label data-auth="state">State</label><input name="state" value="Delhi"></div><br><div class="field"><label data-auth="land">Land area (acres)</label><input name="landArea" type="number" step="0.1"></div><br><div class="field"><label data-auth="preferred">Preferred language</label><select name="preferredLanguage"></select></div><div class="mobile-card auth-bank"><h3>🏦 <span data-auth="payment">Payment account</span></h3><p class="small muted" data-auth="paymentHelp">Used for the prototype's simulated procurement payment workflow.</p><div class="field"><label data-auth="holder">Account holder name</label><input name="accountHolderName" required></div><br><div class="field"><label data-auth="bank">Bank name</label><input name="bankName" required></div><br><div class="field"><label data-auth="account">Account number</label><input name="accountNumber" required inputmode="numeric"></div><br><div class="field"><label data-auth="ifsc">IFSC</label><input name="ifsc" required maxlength="11"></div></div><button class="mobile-btn" data-auth="createAccount">Create account</button></form><div id="result"></div><p class="auth-link"><span data-auth="already">Already registered?</span> <a href="/login.html" data-auth="loginLink">Login</a></p><a class="small muted" href="/" data-auth="exit">← Exit to prototype home</a></div></div></div><script src="/js/api.js"></script><script src="/js/auth-i18n.js"></script><script>setupAuthI18n();const pref=document.querySelector('select[name="preferredLanguage"]');pref.innerHTML=Object.entries(AUTH_LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');pref.value=authLanguage();pref.onchange=()=>{localStorage.setItem('kisanLanguage',pref.value);document.getElementById('authLanguage').value=pref.value;document.getElementById('authLanguage').dispatchEvent(new Event('change'))};form.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(form);try{const d=await api('/api/farmers/signup',{method:'POST',body:JSON.stringify({name:f.get('name'),mobile:f.get('mobile'),village:f.get('village'),district:f.get('district'),state:f.get('state'),landArea:f.get('landArea'),preferredLanguage:f.get('preferredLanguage'),bank:{accountHolderName:f.get('accountHolderName'),bankName:f.get('bankName'),accountNumber:f.get('accountNumber'),ifsc:f.get('ifsc')}})});localStorage.setItem('farmerId',d.farmer.farmerId);localStorage.setItem('kisanLanguage',f.get('preferredLanguage'));location.href='/dashboard.html'}catch(err){result.innerHTML='<div class="notice error">'+escapeHtml(err.message)+'</div>'}})</script></body></html>
