<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Centre Recommendation</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="brand">Smart Centre Recommendation</div><a href="/dashboard.html">Farmer App</a></nav><div class="container"><div class="hero"><h1>Best centre for this crop</h1><p>The recommendation balances crop acceptance, preliminary grade, distance, current queue, service speed and available capacity.</p></div><div id="results" class="grid"></div></div><script src="/js/api.js"></script><script>async function load(){const cropId=new URLSearchParams(location.search).get('crop')||localStorage.getItem('cropRecordId');const farmerId=localStorage.getItem('farmerId');if(!cropId||!farmerId){results.innerHTML='<div class="card">No crop selected.</div>';return}try{const d=await api('/api/farmers/'+farmerId);const crop=d.cropRecords.find(x=>x._id===cropId);const centres=await api('/api/procurement/centres/recommend?cropType='+encodeURIComponent(crop.cropType)+'&grade='+crop.aiScreening.grade+'&quantity='+crop.estimatedQuantity);results.innerHTML=centres.map((c,i)=>'<div class="card"><span class="badge '+(i?'':'warn')+'">'+(i?'Option '+(i+1):'★ Recommended')+'</span><h2>'+escapeHtml(c.name)+'</h2><p>'+escapeHtml(c.distanceKm)+' km · '+escapeHtml(c.queueCount)+' waiting</p><p>Queue delay: <b>'+escapeHtml(c.estimatedQueueDelayMinutes)+' min</b></p><p>Available capacity: <b>'+escapeHtml(c.availableCapacity)+' qtl</b></p><p>Minimum grade: '+escapeHtml(c.minimumGrade)+' · Your preliminary grade: '+escapeHtml(c.aiScreening?.grade||crop.aiScreening.grade)+'</p><p class="small muted">Recommendation score: '+escapeHtml(c.recommendationScore)+' (lower is better)</p><button class="btn" '+(c.gradeAccepted?'':'disabled')+' onclick="book(\''+c._id+'\',\''+crop._id+'\')">Choose slot & get token</button></div>').join('')}catch(e){results.innerHTML='<div class="notice error">'+escapeHtml(e.message)+'</div>'}}async function book(centreId,cropId){try{const b=await api('/api/procurement/book',{method:'POST',body:JSON.stringify({farmerId:localStorage.getItem('farmerId'),cropRecordId:cropId,centreId,slotDate:new Date().toISOString().slice(0,10),slotStart:'10:00',slotEnd:'11:00'})});localStorage.setItem('tokenCode',b.tokenCode);location.href='/dashboard.html'}catch(e){alert(e.message)}}load()</script></body></html>
