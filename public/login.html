<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KrishiSetuAI Login</title><link rel="stylesheet" href="/css/style.css"></head><body class="app-page"><div class="mobile-wrap app-wrap"><div class="phone auth-phone"><div class="auth-screen"><div class="auth-top"><div class="auth-logo small-logo">🌾</div><div><b>KrishiSetuAI</b><div class="small muted">Smart Procurement</div></div><select id="authLanguage" class="language-select" style="margin-left:auto"></select></div><h1 data-auth="loginTitle">Welcome back</h1><p class="muted" data-auth="loginHelp">Login to continue your farmer journey.</p><form id="form"><div class="field"><label data-auth="mobile">Mobile number</label><input id="mobile" data-auth-placeholder="mobilePh" required maxlength="10" inputmode="numeric"></div><br><button class="mobile-btn" data-auth="login">Login to Farmer App</button></form><div id="result"></div><p class="auth-link"><span data-auth="newFarmer">New farmer?</span> <a href="/signup.html" data-auth="create">Create account</a></p><a class="small muted" href="/" data-auth="exit">← Exit to prototype home</a></div></div></div><script src="/js/api.js"></script><script src="/js/auth-i18n.js"></script><script>setupAuthI18n();form.addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/farmers/login',{method:'POST',body:JSON.stringify({mobile:mobile.value})});localStorage.setItem('farmerId',d.farmerId);location.href='/dashboard.html'}catch(err){result.innerHTML='<div class="notice error">'+escapeHtml(err.message)+'</div>'}})</script></body></html>
